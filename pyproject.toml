[project]
name = "zuurstof"
version = "0.1.0"
description = "Dissolved oxygen data processing in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1",
    "pandas>=3,<4",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.pytest]
minversion = "9.0"
norecursedirs = [
    ".*",
    "*.egg*",
    "build",
    "dist",
]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
