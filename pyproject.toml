[project]
name = "zuurstof"
authors = [
    { name = "Matthew P. Humphreys", email = "mvdh7@users.noreply.github.com" }
]
description = "Dissolved oxygen data processing in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1",
    "pandas>=3,<4",
]
dynamic = ["version"]

[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.pytest]
minversion = "9.0"
norecursedirs = [
    ".*",
    "*.egg*",
    "build",
    "dist",
]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "zuurstof/__init__.py"
