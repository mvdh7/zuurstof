[project]
name = "template-python-uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[tool.ruff]
line-length = 79

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2

[tool.pytest]
minversion = "9.0"
norecursedirs = [
    ".*",
    "*.egg*",
    "build",
    "dist",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
